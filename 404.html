<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Página não encontrada | Rafael Miranda</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #d5d5d5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            line-height: 1.65em;
        }

        .box { max-width: 560px; }

        .code {
            font-size: 110px;
            font-weight: 600;
            line-height: 1;
            color: #0ba376;
            letter-spacing: -2px;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            color: #eee;
            margin: 18px 0 14px;
        }

        p { font-size: 15px; margin-bottom: 10px; }

        .sub { color: #9a9a9a; font-size: 14px; }

        .actions { margin-top: 34px; }

        a.btn {
            display: inline-block;
            margin: 6px 5px;
            padding: .8em 2.1em;
            border: 2px solid #0ba376;
            border-radius: 30px;
            color: #0ba376;
            background: transparent;
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: all .3s ease-in-out;
        }

        a.btn:hover, a.btn:focus {
            background-color: #0ba376;
            color: #fff;
        }

        a.btn.filled { background-color: #0ba376; color: #fff; }
        a.btn.filled:hover { background-color: #0dc78f; border-color: #0dc78f; }

        .lang {
            margin-top: 40px;
            font-size: 13px;
            color: #777;
        }

        .lang a { color: #0ba376; text-decoration: none; }
        .lang a:hover { color: #0dc78f; }

        @media (max-width: 480px) {
            .code { font-size: 80px; }
            h1 { font-size: 21px; }
            a.btn { display: block; margin: 10px 0; }
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="code">404</div>

        <h1>Esta página não existe</h1>

        <p>O endereço que você acessou não foi encontrado.</p>
        <p class="sub">This page could not be found.</p>

        <div class="actions">
            <a class="btn filled" href="/">Voltar ao início</a>
            <a class="btn" href="/index2.html">English version</a>
        </div>

        <div class="lang">
            Rafael Miranda &mdash; Engenheiro de Dados &middot;
            <a href="https://github.com/rafaelxm" target="_blank" rel="noopener">GitHub</a>
        </div>
    </div>

</body>
</html>
